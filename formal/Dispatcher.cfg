\* TLC configuration for Dispatcher.tla: 2 items, 2 nonces (tasks.md T021).
\* MaxAttacks = 2 checks every single attack and every pair (449k states, ~30 s on the
\* laptop); 3 exceeds 4M states and does not fit the laptop or the CI time limit.
CONSTANTS
    Items = {i1, i2}
    Nonces = {n1, n2}
    MaxAttacks = 2
    MaxSpec = 1

SPECIFICATION Spec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

INVARIANT TypeOK

PROPERTIES
    NoMergeWithoutOwner
    NoDeployWithoutOwner
    PausedLineNeverAdvances
    TamperedMainHalts
    GateOnlyOnOwnLabel
