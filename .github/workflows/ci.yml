# CI for the factory repository itself.
# Source file: the Owner copies it to .github/workflows/ci.yml (guardrail path; Owner action).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TLA2TOOLS_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
  TLA2TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
  # The versions pinned in factory/profiles/typescript/ci/tools.json; `factory ci scan` refuses others.
  SEMGREP_VERSION: 1.180.0
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install (scripts disabled)
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Format check
        run: npx --no-install prettier --check .
      # The laptop sandbox's tests (T163) run for real: they fail, never skip, without bubblewrap.
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; bubblewrap needs them.
      - name: Install bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # The scan tests run their lever cases against the real pinned tools too: with CI=true
      # they fail, never skip, without them (T136).
      - name: Install semgrep and gitleaks (pinned)
        run: |
          pipx install "semgrep==$SEMGREP_VERSION"
          url="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLf -o gitleaks.tar.gz "$url"
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz
          semgrep --version
          gitleaks version
      - name: Test
        run: npm test

  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fetch tla2tools.jar (pinned by SHA-256)
        run: |
          curl -sSLf -o tla2tools.jar "$TLA2TOOLS_URL"
          echo "$TLA2TOOLS_SHA256  tla2tools.jar" | sha256sum -c -
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Model check
        run: npm run test:formal
