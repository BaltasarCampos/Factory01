# The role permission table (T081): the design's Tools and permissions table (v1.8), the
# `branch` column of data-model.md § Role, and the denials common to every role. It is the one
# source for the generated `.claude/settings.json` and the guards; src/guard/policy.ts reads it
# and refuses anything it does not expect. Each role's `tools` equal its role file's.
#
# write:   paths the role may Write or Edit. `{feature}` is the item's feature folder,
#          `specs/<issue>-<slug>`; `{task}` is the files `.station.json` lists, and
#          `{task:tests}` those of them that are test files. `**` matches any depth.
# shell:   command prefixes, as words, that the role's shell may run. No shell has git network or
#          changes a pull request: the launcher fetches before the session and, once it has
#          ended, pushes the head the Stop hook recorded and opens and readies pull requests
#          (T183, T086).
# blocked: command prefixes always refused for the role, on top of deny_shell.
# network: the hosts the role's sandboxed shell may reach (T183): the package registry for roles
#          that install or audit, `api.github.com` for roles with `gh` in their shell; no other.
# branch:  where the role's work may be pushed: `item` (the branch `.station.json` names),
#          `claude/factory-log`, `claude/define` or `none`. No session pushes: the Stop hook
#          records the head, committing the output of roles that commit nothing, and the launcher
#          pushes it there after the session ends (T086).
roles:
  define:
    tools: [Read, Write, Edit, Bash, Grep, Glob]
    write: ['**']
    # Explicit subcommands, so a shortened name or a form that runs a string never matches (T084).
    shell:
      - npm test
      - npm run
      - npm ci
      - npm install
      - git status
      - git diff
      - git log
      - git show
      - git add
      - git commit
      - git restore
      - git rm
      - git mv
      - git ls-files
      - git grep
      - gh issue
    blocked: [git rebase, git reset, git commit --amend]
    network: [registry.npmjs.org, api.github.com]
    branch: claude/define
  intake:
    tools: [Read, Grep, Glob, Bash]
    write: []
    shell: [gh issue]
    blocked: []
    network: [api.github.com]
    branch: none
  spec:
    tools: [Read, Grep, Glob, Write]
    write: ['{feature}/spec.md', '{feature}/checklists/requirements.md']
    shell: []
    blocked: []
    network: []
    branch: item
  planner:
    tools: [Read, Grep, Glob, Write]
    write:
      - '{feature}/plan.md'
      - '{feature}/research.md'
      - '{feature}/data-model.md'
      - '{feature}/quickstart.md'
      - '{feature}/contracts/**'
      - '{feature}/tasks.md'
    shell: []
    blocked: []
    network: []
    branch: item
  builder:
    # Task is Claude Code 2.1.309's name for Agent, the subagent tool (T125's A3c).
    tools: [Read, Write, Edit, Bash, Grep, Glob, Agent, Task]
    # Never tasks.md, even when a task lists it: the dispatcher ticks it (T174).
    write: ['{task}']
    # Explicit subcommands, as Define's, with what a conflict session needs: the merges (T084).
    shell:
      - npm test
      - npm run
      - npm ci
      - npm install
      - npx vitest
      - vitest
      - git status
      - git diff
      - git log
      - git show
      - git add
      - git commit
      - git restore
      - git rm
      - git mv
      - git stash
      - git ls-files
      - git grep
      - git merge origin/main
      - git merge --abort
    blocked: [git rebase, git reset, git commit --amend]
    network: [registry.npmjs.org]
    branch: item
  test:
    tools: [Read, Grep, Glob, Write, Edit, Bash]
    write: ['{task:tests}']
    shell: [npm test, npm run test, npx vitest, vitest]
    blocked: []
    network: [registry.npmjs.org]
    branch: item
  reviewer:
    tools: [Read, Grep, Glob, Bash, Write]
    write: ['{feature}/reports/verify.md']
    shell: [git diff, gh pr comment]
    blocked: [gh pr review]
    network: [api.github.com]
    branch: item
  security:
    tools: [Read, Grep, Glob, Bash, Write]
    write: ['{feature}/reports/security.md']
    shell: [semgrep, gitleaks, npm audit]
    blocked: []
    network: [registry.npmjs.org]
    branch: item
  integrator:
    tools: [Read, Bash, Write]
    write: ['{feature}/reports/integrate.md']
    # `git merge` makes its own commit; the factory pushes it and marks the pull request ready.
    shell:
      - git merge origin/main
      - git merge --abort
      - git status
      - git diff --name-only
      - gh pr view
      - gh pr checks
    blocked: [gh pr review, git commit, git rebase, git reset, git commit --amend]
    network: [api.github.com]
    branch: item
  release:
    tools: [Read, Write, Bash]
    write: ['.factory/releases/**']
    shell: [git log, git show, git diff]
    blocked: [gh release, git tag]
    network: []
    branch: claude/factory-log
  ops:
    tools: [Read, Grep, Glob, Bash, Write]
    write: ['.factory/ops/**']
    shell: [gh issue]
    blocked: []
    network: [api.github.com]
    branch: claude/factory-log
  coach:
    tools: [Read, Grep, Glob, Write, Bash]
    write: ['.factory/lessons/**']
    shell: [gh pr view, gh pr list]
    blocked: []
    network: [api.github.com]
    branch: claude/factory-log

# Paths no role may Write or Edit (FR-6.4, T173): the guardrail files, the station manifest and
# the event log, which only the factory writes. `except` names the roles a path is open to.
deny_write:
  - '.claude/**'
  - '.mcp.json'
  - '.github/workflows/**'
  - '.factory/config'
  - '.factory/lockfile-policy'
  - '.specify/**'
  - '**/.gitattributes'
  - '**/.gitmodules'
  - '**/CLAUDE.md'
  - '**/CLAUDE.local.md'
  - '**/.station.json'
  - '**/events.jsonl'
  - '.factory/events/**'
  # The repository's own git files: git reads config, hooks, commondir and refs from there (T183).
  - '**/.git'
  - '**/.git/**'
  - { path: '.factory/brief.md', except: [define] }

# Paths no role may read: the approval key and the laptop's key lists and ledger, secrets, the
# Owner's Claude Code state and other sessions, and the global git config, which Claude Code
# re-opens to sandboxed shells (T183). The sandbox denies all of home besides (src/install/sandbox.ts).
deny_read:
  - '~/.factory/**'
  - '~/.ssh/**'
  - '~/.config/gh/**'
  - '~/.git-credentials'
  - '~/.netrc'
  - '~/.npmrc'
  - '~/.gnupg/**'
  - '~/.claude/.credentials.json'
  - '~/.claude.json'
  - '~/.claude/projects/**'
  - '~/.gitconfig'
  - '~/.config/git/**'
  - '**/.env*'

# Commands no role may run, whatever its shell allows: the Owner's own commands, merges,
# approvals and signing, any push, and pull request changes the factory makes. Label changes need
# the command guard's own rules (T084).
deny_shell:
  - git push
  - gh pr create
  - gh pr ready
  - gh pr merge
  - factory approve
  - factory merge
  - factory deploy
  - factory resume
  - factory keygen
  - ssh-keygen -Y sign

# Claude Code tools open to every session besides each role's own, with why. Every other tool of
# the version the release targets is denied, so a tool a later version adds stays denied until it
# is named here (src/install/settings.ts). SubagentHandback is not kept: Claude Code gives it
# only in auto mode, which no session runs in (T061).
keep_tools:
  ToolSearch: loads the factory MCP server's tools, which Claude Code defers until searched
  EndConversation: Claude Code cannot deny it while any other tool remains
  WaitForMcpServers: waits for the factory MCP server while it is still connecting

# Names a command may assign before its program, such as `CI=1 npm test`, each with why; every
# other leading assignment is refused, since one such as PATH, GIT_DIR or LD_PRELOAD changes what
# a command runs or which repository it touches (T084).
assignments:
  CI: makes test runners run once, without watch mode or prompts
  NO_COLOR: turns off coloured output, which a session reads as escape codes
