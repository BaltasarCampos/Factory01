# Security scans (contracts/ci-checks.md, T066, T107, T169): semgrep with the suppression markers,
# gitleaks over every commit, npm audit of the advisories the pull request introduces, and the
# licences of the packages it adds or changes, read from the registry. Each job is built from the
# factory commit pinned in main's .factory/config and calls only `factory ci`. The tools are
# installed at the versions pinned in the release's tools.json, which `factory ci scan` checks.
# No tool runs pull request code. Inputs reach scripts only through env.
name: security

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  # The release names its own source; checked out by the full pinned SHA only.
  FACTORY_REPO: BaltasarCampos/Factory01
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_REF: ${{ github.head_ref }}
  # The versions in factory/profiles/typescript/ci/tools.json.
  SEMGREP_VERSION: 1.180.0
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  NPM_VERSION: 11.11.0

defaults:
  run:
    shell: bash
    working-directory: project

jobs:
  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: project
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned factory commit
        id: pin
        run: |
          from=origin/main
          case "$HEAD_REF" in factory/upgrade-*) from="$HEAD_SHA" ;; esac
          sha=$(git show "$from:.factory/config" |
            sed -nE 's/^factory_release:[[:space:]]*v[0-9.]+@([0-9a-f]{40})[[:space:]]*$/\1/p')
          if [ -z "$sha" ]; then echo "no factory_release pin in $from:.factory/config" >&2; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out the factory at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FACTORY_REPO }}
          ref: ${{ steps.pin.outputs.sha }}
          path: factory
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the factory CLI
        working-directory: factory
        run: |
          npm ci --ignore-scripts
          node node_modules/typescript/bin/tsc -p .
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec node "%s/dist/cli/main.js" "$@"\n' "$PWD" > "$RUNNER_TEMP/bin/factory"
          chmod +x "$RUNNER_TEMP/bin/factory"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install semgrep (pinned)
        run: |
          pipx install "semgrep==$SEMGREP_VERSION"
          semgrep --version
      - name: Semgrep
        run: factory ci scan semgrep "$BASE_SHA" "$HEAD_SHA"
      - name: Suppression markers
        run: factory ci scan markers "$BASE_SHA" "$HEAD_SHA"

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: project
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned factory commit
        id: pin
        run: |
          from=origin/main
          case "$HEAD_REF" in factory/upgrade-*) from="$HEAD_SHA" ;; esac
          sha=$(git show "$from:.factory/config" |
            sed -nE 's/^factory_release:[[:space:]]*v[0-9.]+@([0-9a-f]{40})[[:space:]]*$/\1/p')
          if [ -z "$sha" ]; then echo "no factory_release pin in $from:.factory/config" >&2; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out the factory at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FACTORY_REPO }}
          ref: ${{ steps.pin.outputs.sha }}
          path: factory
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the factory CLI
        working-directory: factory
        run: |
          npm ci --ignore-scripts
          node node_modules/typescript/bin/tsc -p .
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec node "%s/dist/cli/main.js" "$@"\n' "$PWD" > "$RUNNER_TEMP/bin/factory"
          chmod +x "$RUNNER_TEMP/bin/factory"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install gitleaks (pinned, checked by SHA-256)
        working-directory: ${{ runner.temp }}
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLf -o gitleaks.tar.gz "$url"
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz
          gitleaks version
      - name: Gitleaks
        run: factory ci scan gitleaks "$BASE_SHA" "$HEAD_SHA"

  npm-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: project
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned factory commit
        id: pin
        run: |
          from=origin/main
          case "$HEAD_REF" in factory/upgrade-*) from="$HEAD_SHA" ;; esac
          sha=$(git show "$from:.factory/config" |
            sed -nE 's/^factory_release:[[:space:]]*v[0-9.]+@([0-9a-f]{40})[[:space:]]*$/\1/p')
          if [ -z "$sha" ]; then echo "no factory_release pin in $from:.factory/config" >&2; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out the factory at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FACTORY_REPO }}
          ref: ${{ steps.pin.outputs.sha }}
          path: factory
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the factory CLI
        working-directory: factory
        run: |
          npm ci --ignore-scripts
          node node_modules/typescript/bin/tsc -p .
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec node "%s/dist/cli/main.js" "$@"\n' "$PWD" > "$RUNNER_TEMP/bin/factory"
          chmod +x "$RUNNER_TEMP/bin/factory"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install npm (pinned)
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g --ignore-scripts "npm@$NPM_VERSION"
          npm --version
      - name: npm audit
        run: factory ci scan audit "$BASE_SHA" "$HEAD_SHA"

  licences:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: project
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned factory commit
        id: pin
        run: |
          from=origin/main
          case "$HEAD_REF" in factory/upgrade-*) from="$HEAD_SHA" ;; esac
          sha=$(git show "$from:.factory/config" |
            sed -nE 's/^factory_release:[[:space:]]*v[0-9.]+@([0-9a-f]{40})[[:space:]]*$/\1/p')
          if [ -z "$sha" ]; then echo "no factory_release pin in $from:.factory/config" >&2; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out the factory at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FACTORY_REPO }}
          ref: ${{ steps.pin.outputs.sha }}
          path: factory
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the factory CLI
        working-directory: factory
        run: |
          npm ci --ignore-scripts
          node node_modules/typescript/bin/tsc -p .
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec node "%s/dist/cli/main.js" "$@"\n' "$PWD" > "$RUNNER_TEMP/bin/factory"
          chmod +x "$RUNNER_TEMP/bin/factory"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Licences
        run: factory ci licences "$BASE_SHA" "$HEAD_SHA"
